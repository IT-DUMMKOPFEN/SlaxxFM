name: slaxxfm
description: "SlaxxFM – a slim player for free internet music radio stations, sorted by country."
publish_to: 'none'
version: 1.2.0+3

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  media_kit: ^1.1.11
  media_kit_libs_audio: ^1.0.6
  http: ^1.2.2
  crypto: ^3.0.5
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.0
  audio_service: ^0.18.15
  audio_session: ^0.1.21
  file_picker: ^10.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/curated_stations.json
    - assets/logo.png
    - assets/dance/dancers.bin

flutter_launcher_icons:
  android: true
  image_path: "assets/icon/icon_square.png"
  adaptive_icon_background: "assets/icon/adaptive_bg.png"
  adaptive_icon_foreground: "assets/icon/adaptive_fg.png"
  min_sdk_android: 21
  windows:
    generate: true
    image_path: "assets/icon/icon.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "assets/icon/icon_desktop.png"
